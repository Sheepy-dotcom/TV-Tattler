<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Hollyoaks — bright and youthful">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e599f7"/>
      <stop offset="0.55" stop-color="#be4bdb"/>
      <stop offset="1" stop-color="#6f2c91"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- sunburst -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="60">
    <line x1="1300" y1="240" x2="1300" y2="-200"/>
    <line x1="1300" y1="240" x2="1720" y2="-100"/>
    <line x1="1300" y1="240" x2="900" y2="-100"/>
    <line x1="1300" y1="240" x2="1720" y2="500"/>
  </g>
  <circle cx="1300" cy="240" r="120" fill="#fff0fb" fill-opacity="0.9"/>
  <!-- confetti -->
  <g>
    <rect x="200" y="180" width="34" height="34" rx="6" fill="#ffd166" transform="rotate(20 217 197)"/>
    <circle cx="480" cy="140" r="18" fill="#63e6be"/>
    <rect x="720" y="200" width="30" height="30" rx="6" fill="#74c0fc" transform="rotate(-15 735 215)"/>
    <circle cx="980" cy="160" r="16" fill="#ffa8d6"/>
    <rect x="360" y="300" width="26" height="26" rx="6" fill="#ff922b" transform="rotate(30 373 313)"/>
  </g>
  <!-- modern building silhouettes -->
  <g fill="#4a1c66">
    <rect x="120" y="560" width="200" height="340" rx="10"/>
    <rect x="360" y="500" width="150" height="400" rx="10"/>
    <rect x="1180" y="540" width="180" height="360" rx="10"/>
    <rect x="1380" y="600" width="180" height="300" rx="10"/>
  </g>
  <!-- bright windows -->
  <g fill="#ffe08a">
    <rect x="150" y="600" width="40" height="40" rx="5"/><rect x="210" y="600" width="40" height="40" rx="5"/>
    <rect x="150" y="670" width="40" height="40" rx="5"/><rect x="400" y="560" width="40" height="40" rx="5"/>
    <rect x="1220" y="600" width="40" height="40" rx="5"/><rect x="1420" y="660" width="40" height="40" rx="5"/>
  </g>
  <text x="72" y="150" font-family="'DM Mono',monospace" font-size="30" letter-spacing="8" fill="#ffffff" fill-opacity="0.9">CHESTER</text>
</svg>
