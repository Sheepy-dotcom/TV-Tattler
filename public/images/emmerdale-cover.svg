<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Emmerdale — the Yorkshire Dales">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9f0d0"/>
      <stop offset="1" stop-color="#8fd99b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="1300" cy="220" r="95" fill="#fff3bf"/>
  <!-- rolling hills, back to front -->
  <path d="M0 520 Q400 400 800 500 T1600 470 L1600 900 L0 900 Z" fill="#51cf66"/>
  <path d="M0 640 Q450 520 900 620 T1600 600 L1600 900 L0 900 Z" fill="#2f9e44"/>
  <path d="M0 760 Q500 660 1000 750 T1600 730 L1600 900 L0 900 Z" fill="#14622a"/>
  <!-- drystone field lines -->
  <g stroke="#0f4d20" stroke-width="5" opacity="0.5" fill="none">
    <path d="M120 640 L60 760"/><path d="M460 600 L520 720"/><path d="M980 640 L1040 770"/>
  </g>
  <!-- barn / farmhouse -->
  <g>
    <rect x="640" y="470" width="230" height="150" fill="#7a3b1a"/>
    <path d="M640 470 L755 400 L870 470 Z" fill="#5a2a10"/>
    <rect x="720" y="530" width="60" height="90" fill="#3a1a08"/>
  </g>
  <!-- tree -->
  <g>
    <rect x="1080" y="470" width="24" height="120" fill="#5a3410"/>
    <circle cx="1092" cy="450" r="70" fill="#2f9e44"/>
    <circle cx="1140" cy="480" r="50" fill="#37b24d"/>
    <circle cx="1044" cy="480" r="50" fill="#37b24d"/>
  </g>
  <!-- sheep -->
  <g fill="#ffffff">
    <ellipse cx="300" cy="720" rx="26" ry="18"/><circle cx="322" cy="716" r="9" fill="#333"/>
    <ellipse cx="380" cy="740" rx="24" ry="17"/><circle cx="400" cy="736" r="8" fill="#333"/>
    <ellipse cx="1180" cy="720" rx="26" ry="18"/><circle cx="1202" cy="716" r="9" fill="#333"/>
  </g>
  <text x="72" y="150" font-family="'DM Mono',monospace" font-size="30" letter-spacing="8" fill="#14622a" fill-opacity="0.8">YORKSHIRE DALES</text>
</svg>
